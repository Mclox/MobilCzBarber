name: barbers_app
description: App móvil para barbería
publish_to: "none"
version: 0.1.21+22

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  dio: ^5.0.0
  shared_preferences: ^2.0.15
  intl: ^0.18.0
  table_calendar: ^3.0.9
  flutter_local_notifications: ^17.2.2
  cupertino_icons: ^1.0.5
  go_router: ^14.8.1
  google_fonts: ^6.3.2
  image_picker: ^1.1.2
  url_launcher: ^6.2.5
  package_info_plus: ^8.1.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/ # Esto incluye logo.png y todo lo que esté ahí dentro
    - assets/images/services/
    - assets/images/products/
